<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>风格预览 P1 · 8-bit 像素街机</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0f0f1b}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:#0f0f1b}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#0f0f1b}
.slide{position:absolute;inset:0;width:1920px;height:1080px;visibility:hidden;opacity:0;pointer-events:none}
.slide.active{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
:root{--bg:#0f0f1b;--ink:#e8e3d5;--gold:#ffd23f;--red:#ff5d5d;--cyan:#3fd2ff;--green:#54e07c;--purple:#7b5cff;--dark:#1b1b2e}
.slide{font-family:Consolas,"Cascadia Mono","Microsoft YaHei",monospace;color:var(--ink);padding:80px 110px;display:flex;flex-direction:column;
 image-rendering:pixelated;background:
 linear-gradient(rgba(63,210,255,.035) 1px,transparent 1px) 0 0/32px 32px,
 linear-gradient(90deg,rgba(63,210,255,.035) 1px,transparent 1px) 0 0/32px 32px,var(--bg)}
.hud-top{display:flex;justify-content:space-between;align-items:center;font-size:26px;letter-spacing:4px;color:var(--cyan)}
.hud-top .hi{color:var(--gold)}
.px-frame{border:4px solid var(--ink);box-shadow:8px 8px 0 0 #000, inset 0 0 0 4px var(--bg), inset 0 0 0 8px var(--ink)}
.banner{background:var(--gold);color:#0f0f1b;font-weight:900;font-size:30px;letter-spacing:10px;text-align:center;padding:16px;width:fit-content;margin:44px 0 0;box-shadow:6px 6px 0 #000}
.mid{flex:1;display:flex;gap:90px;align-items:center}
h1{font-size:88px;line-height:1.3;margin:0;font-weight:900;letter-spacing:2px}
h1 .g{color:var(--gold)} h1 .c{color:var(--cyan)} h1 .r{color:var(--red)}
.px-chip{display:inline-block;border:3px solid var(--ink);padding:14px 26px;font-size:26px;margin:14px 8px 0 0;box-shadow:5px 5px 0 #000;background:var(--dark)}
.px-chip.gold{background:var(--gold);color:#0f0f1b;border-color:var(--gold);box-shadow:5px 5px 0 #b8860b}
.px-chip.cy{background:var(--cyan);color:#0f0f1b;border-color:var(--cyan);box-shadow:5px 5px 0 #0e6e8c}
.px-chip.gr{background:var(--green);color:#0f0f1b;border-color:var(--green);box-shadow:5px 5px 0 #1d7a3d}
.right{width:560px}
.score-row{display:flex;justify-content:space-between;font-size:30px;padding:16px 22px;margin-bottom:14px;background:var(--dark);border:3px solid var(--ink);box-shadow:5px 5px 0 #000}
.score-row .n{color:var(--cyan)} .score-row .v{color:var(--gold);font-weight:900}
.score-row.top{background:var(--gold);color:#0f0f1b}.score-row.top .n,.score-row.top .v{color:#0f0f1b}
.blink{animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.foot{display:flex;justify-content:space-between;font-size:22px;color:#8d8db0;letter-spacing:3px}
.press{color:var(--gold);font-size:24px;letter-spacing:6px;text-align:center;margin-top:20px}
</style>
</head>
<body><div class="deck-viewport"><div class="deck-stage" id="stage">
<section class="slide active">
  <div class="hud-top"><span>LEADERBOARD SYSTEM</span><span><span class="hi">&#9733;</span> HI-SCORE 999999</span></div>
  <div class="banner">STAGE 07 · THE ONE IDEA</div>
  <div class="mid">
    <div>
      <h1>不给玩家存<br><span class="g">"当前分数"</span><br>存加分事件的<br><span class="c">不可变集合</span></h1>
      <div style="margin-top:34px">
        <span class="px-chip">score = &Sigma; entries</span>
        <span class="px-chip gold">merge = A &cup; B</span>
        <span class="px-chip gr">9 FAULTS &rarr; HARMLESS</span>
      </div>
    </div>
    <div class="right">
      <div class="score-row top"><span class="n">1ST &middot; node1</span><span class="v">0495 PTS</span></div>
      <div class="score-row"><span class="n">2ND &middot; node2</span><span class="v">0495 PTS</span></div>
      <div class="score-row"><span class="n">3RD &middot; node3</span><span class="v">0495 PTS</span></div>
      <div class="score-row"><span class="n" style="color:var(--red)">&times;&times; PARTITION &times;&times;</span><span class="v" style="color:var(--red)">HEALED</span></div>
      <div class="press blink">- 1UP CONVERGED -</div>
    </div>
  </div>
  <div class="foot"><span>&copy; 2026 PARALLEL COMPUTING</span><span>SPEAKER A</span><span>07 / 21</span></div>
</section>
</div></div>
<script>
const fit=()=>{const v=document.querySelector('.deck-viewport'),s=document.getElementById('stage');
const k=Math.min(v.clientWidth/1920,v.clientHeight/1080);
s.style.transform=`translate(${(v.clientWidth-1920*k)/2}px,${(v.clientHeight-1080*k)/2}px) scale(${k})`};
addEventListener('resize',fit);fit();
</script>
</body>
</html>
