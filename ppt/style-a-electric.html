<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>风格预览 A · Electric Studio</title>
<style>
/* viewport-base (fixed 16:9 stage) */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0a0a}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:#0a0a0a}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#fff}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;visibility:hidden;opacity:0;pointer-events:none}
.slide.active{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
/* Electric Studio */
:root{--bg-dark:#0a0a0a;--bg-white:#ffffff;--accent:#4361ee;--text-dark:#0a0a0a;--text-light:#ffffff}
.slide{display:flex;flex-direction:column}
.panel-top{height:56%;background:var(--bg-white);position:relative;display:flex;flex-direction:column;justify-content:center;padding:0 140px}
.panel-bottom{height:44%;background:var(--bg-dark);position:relative;display:flex;align-items:center;padding:0 140px;color:var(--text-light)}
.accent-bar{position:absolute;left:0;top:0;width:14px;height:100%;background:var(--accent)}
.eyebrow{font:600 26px/1 "Manrope","Microsoft YaHei",sans-serif;letter-spacing:.35em;color:var(--accent);text-transform:uppercase;margin-bottom:38px}
h1{font:800 118px/1.12 "Manrope","Microsoft YaHei",sans-serif;color:var(--text-dark);margin:0;letter-spacing:-0.01em}
h1 .em{color:var(--accent)}
.formula{margin-top:44px;display:flex;gap:28px}
.f-chip{font:500 30px/1 "Manrope",monospace;border:2.5px solid var(--text-dark);padding:20px 34px;border-radius:999px}
.f-chip.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.panel-bottom .col{max-width:760px}
.panel-bottom h3{font:800 34px/1.3 "Manrope","Microsoft YaHei",sans-serif;margin:0 0 22px}
.panel-bottom p{font:400 25px/1.65 "Manrope","Microsoft YaHei",sans-serif;color:#c9c9c9;margin:0}
.pageno{position:absolute;right:60px;bottom:40px;font:600 22px "Manrope";color:#777}
.brand{position:absolute;right:60px;top:44px;font:600 22px "Manrope";letter-spacing:.25em;color:#999}
</style>
</head>
<body>
<div class="deck-viewport"><div class="deck-stage" id="stage">
<section class="slide active">
  <div class="panel-top">
    <div class="accent-bar"></div>
    <div class="brand">PARALLEL COMPUTING</div>
    <div class="eyebrow">The One Idea · 核心设计</div>
    <h1>不给玩家存"当前分数"<br>存加分事件的<span class="em">不可变集合</span></h1>
    <div class="formula">
      <div class="f-chip">score = Σ entries</div>
      <div class="f-chip acc">merge = A ∪ B</div>
    </div>
  </div>
  <div class="panel-bottom">
    <div class="col">
      <h3>一个数据结构,九个故障变无害</h3>
      <p>重复投递被并集幂等吸收 · 乱序被交换律化解 · 分区愈合即两侧之和 —— 收敛性是数学性质,不是测试运气。</p>
    </div>
    <div class="pageno">07 / 20</div>
  </div>
</section>
</div></div>
<script>
const fit=()=>{const v=document.querySelector('.deck-viewport'),s=document.getElementById('stage');
const k=Math.min(v.clientWidth/1920,v.clientHeight/1080);
s.style.transform=`translate(${(v.clientWidth-1920*k)/2}px,${(v.clientHeight-1080*k)/2}px) scale(${k})`};
addEventListener('resize',fit);fit();
</script>
</body>
</html>
